      - {value: tirupati, te: తిరుపతి, en: Tirupati, aliases: [tirupati]}
  - key: phone
    type: phone
    risk: critical
    label_te: ఫోన్ నంబర్
    label_en: Phone number
    prompt_te: మీ ఫోన్ నంబర్ చెప్పండి.
    prompt_en: Tell me your phone number.
  - key: land_acres
    type: decimal
    risk: critical
    min: 0.1
    max: 500
    label_te: భూమి (ఎకరాలు)
    label_en: Land (acres)
    prompt_te: మీకు ఎన్ని ఎకరాల భూమి ఉంది?
    prompt_en: How many acres of land do you have?
  - key: crop
    type: choice
    risk: low
    label_te: ప్రధాన పంట
    label_en: Main crop
    prompt_te: మీరు ప్రధానంగా ఏ పంట వేస్తారు?
    prompt_en: Which crop do you mainly grow?
    choices:
      - {value: paddy, te: వరి, en: Paddy, aliases: [paddy, rice, వరి, వడ్లు]}
      - {value: chilli, te: మిరప, en: Chilli, aliases: [chilli, chili, మిరప, మిర్చి, మిరపకాయ]}
      - {value: cotton, te: పత్తి, en: Cotton, aliases: [cotton, పత్తి]}
      - {value: groundnut, te: వేరుశనగ, en: Groundnut, aliases: [groundnut, peanut, వేరుశనగ, వేరుశెనగ, పల్లీలు]}
      - {value: other, te: ఇతర, en: Other, aliases: [other, ఇతర, వేరే]}
  - key: has_bank
    type: yes_no
    risk: low
    label_te: బ్యాంక్ ఖాతా
    label_en: Bank account
    prompt_te: మీకు బ్యాంక్ ఖాతా ఉందా?
    prompt_en: Do you have a bank account?

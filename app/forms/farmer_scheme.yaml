# DEMO FORM. Not a real government scheme. Use fake data only.
# Telugu text is a draft: have a native speaker review it.
id: farmer_scheme
title_te: రైతు సహాయ పథకం (డెమో)
title_en: Demo Farmer Support Scheme
fields:
  - key: name
    type: text
    risk: medium
    label_te: పేరు
    label_en: Name
    prompt_te: మీ పేరు ఏమిటి?
    prompt_en: What is your name?
  - key: age
    type: integer
    risk: medium
    min: 18
    max: 100
    label_te: వయస్సు
    label_en: Age
    prompt_te: మీ వయస్సు ఎంత?
    prompt_en: How old are you?
  - key: village
    type: text
    risk: medium
    label_te: ఊరు
    label_en: Village
    prompt_te: మీ ఊరు పేరు ఏమిటి?
    prompt_en: What is your village?
  - key: district
    type: choice
    risk: medium
    label_te: జిల్లా
    label_en: District
    prompt_te: మీ జిల్లా ఏది?
    prompt_en: Which district?
    # Verify this list against an official source before shipping: names change over time.
    choices:
      - {value: srikakulam, te: శ్రీకాకుళం, en: Srikakulam, aliases: [srikakulam]}
      - {value: parvathipuram_manyam, te: పార్వతీపురం మన్యం, en: Parvathipuram Manyam, aliases: [parvathipuram, manyam, పార్వతీపురం]}
      - {value: vizianagaram, te: విజయనగరం, en: Vizianagaram, aliases: [vizianagaram]}
      - {value: visakhapatnam, te: విశాఖపట్నం, en: Visakhapatnam, aliases: [visakhapatnam, vizag, vishakhapatnam, వైజాగ్, విశాఖపట్టణం, విశాఖ]}
      - {value: alluri_sitharama_raju, te: అల్లూరి సీతారామరాజు, en: Alluri Sitharama Raju, aliases: [alluri, అల్లూరి]}
      - {value: anakapalli, te: అనకాపల్లి, en: Anakapalli, aliases: [anakapalli, anakapalle]}
      - {value: kakinada, te: కాకినాడ, en: Kakinada, aliases: [kakinada]}
      - {value: east_godavari, te: తూర్పు గోదావరి, en: East Godavari, aliases: [east godavari, తూర్పు గోదావరి]}
      - {value: konaseema, te: కోనసీమ, en: Konaseema, aliases: [konaseema]}
      - {value: eluru, te: ఏలూరు, en: Eluru, aliases: [eluru]}
      - {value: west_godavari, te: పశ్చిమ గోదావరి, en: West Godavari, aliases: [west godavari, పశ్చిమ గోదావరి]}
      - {value: ntr, te: ఎన్టీఆర్, en: NTR, aliases: [ntr, ఎన్టీఆర్, విజయవాడ]}
      - {value: krishna, te: కృష్ణా, en: Krishna, aliases: [krishna, కృష్ణ, మచిలీపట్నం]}
      - {value: palnadu, te: పల్నాడు, en: Palnadu, aliases: [palnadu]}
      - {value: guntur, te: గుంటూరు, en: Guntur, aliases: [guntur]}
      - {value: bapatla, te: బాపట్ల, en: Bapatla, aliases: [bapatla]}
      - {value: prakasam, te: ప్రకాశం, en: Prakasam, aliases: [prakasam, ఒంగోలు]}
      - {value: nellore, te: నెల్లూరు, en: Nellore, aliases: [nellore]}
      - {value: kurnool, te: కర్నూలు, en: Kurnool, aliases: [kurnool]}
      - {value: nandyal, te: నంద్యాల, en: Nandyal, aliases: [nandyal]}
      - {value: anantapur, te: అనంతపురం, en: Anantapur, aliases: [anantapur, anantapuram]}
      - {value: sri_sathya_sai, te: శ్రీ సత్యసాయి, en: Sri Sathya Sai, aliases: [sathya sai, సత్యసాయి, పుట్టపర్తి]}

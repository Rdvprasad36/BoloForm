<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolo Form: evaluation</title>
  <link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top"><a href="/"><img src="/logo.svg" alt="Bolo Form" class="logo"></a>
  <nav><a href="/">App</a><a href="/limits">Limits</a></nav></header>
<main>
  <h1>Evaluation</h1>
  <p class="en">Headline metric: <strong>silent-error rate</strong>, the share of fields where a wrong value ended up in the form with no flag raised.</p>
  <div id="banner"></div>
  <div id="out"><p>Loading…</p></div>
  <p class="notice">Generated by <code>python -m eval.run_eval</code>. See the Limits page before quoting any number.</p>
</main>
<script>
  const el = (t, txt, cls) => { const e = document.createElement(t); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };
  const pct = (x) => (x * 100).toFixed(1) + "%";
  fetch("/api/eval/latest").then(async (r) => {
    const out = document.getElementById("out"); out.replaceChildren();
    if (!r.ok) { out.append(el("p", "No results yet. Run: make eval")); return; }
    const d = await r.json(), m = d.meta;
    if (m.simulated) document.getElementById("banner").append(el("p",
      "SIMULATED RESULTS (mock provider). Errors are injected by a random generator. These numbers test the plumbing only and say nothing about Gnani models.", "banner"));
    out.append(el("p", `Provider: ${m.provider} | split: ${m.split} | personas: ${m.personas} | generated: ${m.generated_at}`, "en"));
    for (const [cond, pols] of Object.entries(d.results)) {
      out.append(el("h2", `Condition: ${cond}`));
      const wrap = el("div"); wrap.style.overflowX = "auto";
      const t = el("table"), head = el("tr");
      for (const h of ["Policy", "n", "First-pass", "Final", "Silent errors (95% CI)", "Caught", "Turns/form", "Confirms/form", "Typed"]) head.append(el("th", h));
      t.append(head);
      for (const [pol, r] of Object.entries(pols)) {
        const row = el("tr");
        const ci = r.silent_error_rate_ci95;
        for (const c of [pol, r.n_fields, pct(r.first_pass_acc), pct(r.final_acc),
                         `${pct(r.silent_error_rate)} (${pct(ci[0])}-${pct(ci[1])})`, r.errors_caught,
                         r.turns_per_form, r.confirms_per_form, pct(r.typed_fallback_rate)]) row.append(el("td", c));
        t.append(row);
      }
      wrap.append(t); out.append(wrap);
    }
    out.append(el("h2", "Worst adaptive-policy failures (synthetic data)"));
    const ul = el("ul");
    for (const w of d.worst_adaptive_failures.slice(0, 10))
      ul.append(el("li", `[${w.condition}] ${w.key}: truth=${JSON.stringify(w.truth)} got=${JSON.stringify(w.got)} heard=${JSON.stringify(w.heard)} (${w.status})`));
    if (!ul.children.length) ul.append(el("li", "none in this run"));
    out.append(ul);
  }).catch(() => { document.getElementById("out").textContent = "Could not load results."; });
</script>
</body>
</html>

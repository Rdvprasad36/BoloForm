<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Bolo Form</title>
  <desc id="d">A teal rounded square. Sound-wave bars on the left flow into a paper form with lines and a saffron check mark.</desc>
  <style>
    .ink { fill: #0B1B2B; }
    .sub { fill: #4B5B6B; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E6EDF3; }
      .sub { fill: #9FB0C0; }
    }
  </style>

  <!-- Icon -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="#0F766E"/>

  <!-- Sound-wave bars (speech) -->
  <rect x="38" y="88"  width="6" height="24" rx="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="50" y="74"  width="6" height="52" rx="3" fill="#FFFFFF"/>
  <rect x="62" y="82"  width="6" height="36" rx="3" fill="#FFFFFF" opacity="0.9"/>
  <rect x="74" y="92"  width="6" height="16" rx="3" fill="#FFFFFF" opacity="0.75"/>

  <!-- Form sheet -->
  <rect x="90" y="46" width="72" height="108" rx="12" fill="#FFFFFF"/>
  <rect x="100" y="62" width="52" height="7" rx="3.5" fill="#0F766E" opacity="0.85"/>
  <rect x="100" y="77" width="52" height="7" rx="3.5" fill="#0F766E" opacity="0.55"/>
  <rect x="100" y="92" width="34" height="7" rx="3.5" fill="#0F766E" opacity="0.35"/>

  <!-- Check mark (confirmed) -->
  <circle cx="138" cy="130" r="15" fill="#F59E0B"/>
  <path d="M130.5 130.5 l5.5 5.5 l10 -11" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="212" y="108" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F766E">Bolo</tspan><tspan class="ink" dx="12">Form</tspan>
  </text>
  <text x="214" y="144" class="sub" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="0.5">Speak. Confirm. Done.</text>
  <text x="214" y="174" class="sub" font-family="'Noto Sans Telugu', 'Nirmala UI', Gautami, sans-serif" font-size="20">చెప్పండి, ఫారం నిండింది</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
